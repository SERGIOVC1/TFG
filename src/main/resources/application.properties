# ============================================
# === CONEXIÓN A POSTGRESQL EN AZURE =========
# ============================================

# URL JDBC a tu servidor en Azure con la BBDD correcta
spring.datasource.url=jdbc:postgresql://tfgbbdd.postgres.database.azure.com:5432/postgres?charSet=UTF8

# Usuario y contraseña que configuraste (sin @host)
spring.datasource.username=bitnami
spring.datasource.password=KAli*****

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# === CONFIGURACIÓN JPA / HIBERNATE ==========
# ============================================

# Actualiza el esquema según las entidades
spring.jpa.hibernate.ddl-auto=update

# Dialecto PostgreSQL (opcional con Hibernate 6+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Codificación y Unicode
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

