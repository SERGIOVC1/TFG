# Conexión a la base de datos con charset UTF8 explícito
spring.datasource.url=jdbc:postgresql://localhost:5432/tfg?charSet=UTF8
spring.datasource.username=root
spring.datasource.password=root12345

# Actualización automática del esquema (según lo tenías)
spring.jpa.hibernate.ddl-auto=update

# Opcionales para asegurar que Hibernate use UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

