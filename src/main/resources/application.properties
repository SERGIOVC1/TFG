# ============================================
# === CONEXIÓN A POSTGRESQL USANDO ENV =======
# ============================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER-CLASS-NAME}

# ============================================
# === CONFIGURACIÓN JPA / HIBERNATE ==========
# ============================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL-AUTO}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.connection.charSet=${SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_CHARSET}
spring.jpa.properties.hibernate.connection.characterEncoding=${SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_CHARACTERENCODING}
spring.jpa.properties.hibernate.connection.useUnicode=${SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_USEUNICODE}

# ============================================
# === LOGGING OPCIONAL PARA DEBUG ============
# ============================================

